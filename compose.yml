name: techlead

services:
  # Local Postgres for pytest only (TEST_DATABASE_URL); the app itself always uses Supabase.
  # Not started by `docker compose up`; start it with `docker compose up -d db`.
  db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: techlead
      POSTGRES_PASSWORD: techlead
      POSTGRES_DB: techlead
    ports:
      - "127.0.0.1:5433:5432"  # 5433 on the host so a locally installed Postgres keeps 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techlead -d techlead"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
