name: techlead

services:

  nginx:
    container_name: techlead-nginx
    image: nginx:1.27-alpine
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

  backend:
    container_name: techlead-backend
    build:
      context: .
      target: api
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "127.0.0.1:8000:8000"

  # Runs NewLeadFlow on queued AI analysis jobs (new leads, "Analyze" clicks). Needs OPENAI_API_KEY in .env.
  worker:
    container_name: techlead-worker
    build:
      context: .
      target: worker
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    restart: unless-stopped

  frontend:
    container_name: techlead-frontend
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      # Google sign-in in the browser: only the public URL and publishable key, never the secret key.
      SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
