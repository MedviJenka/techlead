# Single entry point on :80 — /api goes to the FastAPI backend, everything else to the Vite frontend.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Resolve compose service names at request time so nginx starts even if an upstream is still booting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_read_timeout 300s;  # crew analysis calls can run long
        }

        location / {
            set $frontend http://frontend:5173;
            proxy_pass $frontend;
            # Vite HMR websocket
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
