[project]
name = "techlead"
version = "0.1.0"
# crewai 1.15 pins chromadb~=1.1, which cannot import on Python 3.14 (pydantic.v1)
requires-python = ">=3.13,<3.14"
# The API image installs only these. CrewAI runs in the worker image (the `ai` group): MAIN_PLAN §65.
dependencies = [
    "cellenium>=0.3.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "logfire>=5.1.1",
    "phonenumbers>=8.13",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10",
    "pytest-xdist>=3.8.0",
    "supabase>=2.32.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
ai = [
    "boto3>=1.36",
    "crewai>=1.15.23",
]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
# `uv sync` installs everything for development and CI; the Docker images pick their groups explicitly.
default-groups = ["dev", "ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
per-file-ignores = { "settings.py" = ["E501"] }

[tool.ruff.lint.isort]
# The repo's `supabase/` folder (Supabase CLI config) is not the `supabase` package.
known-third-party = ["supabase"]

[tool.mypy]
python_version = "3.13"
packages = ["app"]
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `ai/` is outside the strict `app` scope: use its types, but report errors only in `app`.
module = ["ai.*"]
follow_imports = "silent"
