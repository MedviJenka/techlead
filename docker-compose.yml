name: techlead

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: techlead
      POSTGRES_PASSWORD: techlead
      POSTGRES_DB: techlead
    ports:
      - "5433:5432"  # 5433 on the host so a locally installed Postgres keeps 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techlead -d techlead"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://techlead:techlead@db:5432/techlead
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
